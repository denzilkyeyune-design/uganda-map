<!DOCTYPE html>
<html>
<head>
    <title>Bantustats - Regional Map</title>

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<!-- LEFT SIDEBAR (LOGO + CONTROLS) -->
<div id="left-sidebar">
    <img id="logo" src="bantustats.png" alt="Bantustats logo">

    <h2>Map Controls</h2>

    <label><input type="checkbox" id="toggleBasemap" checked> Basemap</label><br>
    <label><input type="checkbox" id="toggleRegions" checked> Show Regions</label>
</div>

<!-- RIGHT SIDEBAR (REGION INFO) -->
<div id="right-sidebar">

    <!-- TABS -->
    <div id="tabs">
        <button class="tab active" data-tab="about">About</button>
        <button class="tab" data-tab="public">Public Sector</button>
        <button class="tab" data-tab="private">Private Sector</button>
        <button class="tab" data-tab="household">Household and Non-Profit Sector</button>
    </div>

    <!-- TAB CONTENT -->
    <div id="tab-content">
        <div id="about" class="tab-pane active">
            <h2>Region Info</h2>
            <div id="region-details">Click a region to view details.</div>
        </div>

        <div id="public" class="tab-pane">
            <h2>Public Sector</h2>
            <p>Coming soon...</p>
        </div>

        <div id="private" class="tab-pane">
            <h2>Private Sector</h2>
            <p>Coming soon...</p>
        </div>

        <div id="household" class="tab-pane">
            <h2>Household and Non-Profit Sector</h2>
            <p>Coming soon...</p>
        </div>
    </div>

</div>

<!-- MAP -->
<div id="map"></div>

<script src="script.js"></script>

</body>
</html>
