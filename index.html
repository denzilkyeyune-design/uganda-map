<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Regional Map</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    html {
      height: 100%;
    }

    .app-container {
      display: flex;
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .map-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2%;
      transition: flex 0.3s ease;
    }

    .map-section.sidebar-open {
      flex: 0.6;
    }

    .header {
      margin-bottom: 2%;
    }

    .map-title {
      color: white;
      font-size: 2em;
      font-weight: bold;
      margin: 0 0 1% 0;
    }

    .search-container {
      position: relative;
      margin-bottom: 2%;
    }

    .search-input {
      width: 100%;
      padding: 1.2% 3% 1.2% 4%;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    .search-icon {
      position: absolute;
      left: 1.5%;
      top: 50%;
      transform: translateY(-50%);
      color: #667eea;
      font-size: 1.2em;
    }

    .map-container {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 3%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .map-svg {
      width: 90%;
      height: 90%;
      max-width: 800px;
      max-height: 600px;
    }

    .region {
      fill: #e0e7ff;
      stroke: #667eea;
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .region:hover {
      fill: #c7d2fe;
      transform: scale(1.05);
      transform-origin: center;
    }

    .region.selected {
      fill: #667eea;
      stroke: #4c51bf;
      stroke-width: 3;
      filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.4));
    }

    .region-label {
      fill: #4c51bf;
      font-size: 0.9em;
      font-weight: 600;
      pointer-events: none;
      text-anchor: middle;
    }

    .sidebar {
      width: 0;
      background: white;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      width: 35%;
      min-width: 300px;
    }

    .sidebar-content {
      padding: 6%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar.open .sidebar-content {
      opacity: 1;
    }

    .close-btn {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 2em;
      color: #667eea;
      cursor: pointer;
      padding: 4%;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #4c51bf;
    }

    .sidebar-title {
      color: #667eea;
      font-size: 2em;
      font-weight: bold;
      margin: 0 0 3% 0;
    }

    .sidebar-description {
      color: #4b5563;
      font-size: 1em;
      line-height: 1.6;
      margin-bottom: 5%;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3%;
      margin-top: 5%;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 5%;
      border-radius: 12px;
      color: white;
    }

    .stat-label {
      font-size: 0.8em;
      opacity: 0.9;
      margin-bottom: 2%;
    }

    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
    }

    .info-section {
      margin-top: 6%;
      padding-top: 6%;
      border-top: 2px solid #e5e7eb;
    }

    .info-title {
      color: #667eea;
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 3%;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .info-list li {
      padding: 3% 0;
      color: #4b5563;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-list li:last-child {
      border-bottom: none;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }

      .map-section {
        flex: 1;
      }

      .map-section.sidebar-open {
        flex: 0.5;
      }

      .sidebar.open {
        width: 100%;
        position: absolute;
        height: 100%;
        z-index: 10;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="app-container">
   <div class="map-section" id="mapSection">
    <div class="header">
     <h1 class="map-title" id="mapTitle">Interactive Regional Map</h1>
     <div class="search-container"><span class="search-icon">🔍</span> <input type="text" class="search-input" id="searchInput" placeholder="Search for a region...">
     </div>
    </div>
    <div class="map-container">
     <svg class="map-svg" viewbox="0 0 800 600" id="mapSvg"><!-- Northern Region --> <polygon class="region" data-region="northern" points="200,100 400,80 450,150 350,200 250,180" /> <text class="region-label" x="330" y="150">
       Northern
      </text> <!-- Eastern Region --> <polygon class="region" data-region="eastern" points="450,150 600,120 620,250 500,280 450,220" /> <text class="region-label" x="530" y="210">
       Eastern
      </text> <!-- Central Region --> <polygon class="region" data-region="central" points="250,180 350,200 450,220 420,320 300,340 220,280" /> <text class="region-label" x="330" y="270">
       Central
      </text> <!-- Western Region --> <polygon class="region" data-region="western" points="150,250 220,280 300,340 280,450 150,420" /> <text class="region-label" x="220" y="360">
       Western
      </text> <!-- Southern Region --> <polygon class="region" data-region="southern" points="280,450 420,420 500,480 450,550 300,530" /> <text class="region-label" x="390" y="490">
       Southern
      </text> <!-- Coastal Region --> <polygon class="region" data-region="coastal" points="500,280 620,250 650,380 580,450 500,420 420,320" /> <text class="region-label" x="540" y="360">
       Coastal
      </text>
     </svg>
    </div>
   </div>
   <div class="sidebar" id="sidebar"><button class="close-btn" id="closeBtn">×</button>
    <div class="sidebar-content" id="sidebarContent"></div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      map_title: "Interactive Regional Map",
      search_placeholder: "Search for a region...",
      primary_color: "#667eea",
      secondary_color: "#764ba2",
      surface_color: "#ffffff",
      text_color: "#4b5563",
      accent_color: "#e0e7ff"
    };

    const regionData = {
      northern: {
        name: "Northern Region",
        description: "A mountainous region known for its scenic valleys and rich cultural heritage. Home to diverse communities and stunning natural landscapes.",
        population: "2.5M",
        area: "15,432 km²",
        capital: "Northville",
        gdp: "$45B",
        highlights: [
          "Mountain ranges and hiking trails",
          "Traditional craft markets",
          "Historic monasteries and temples",
          "Winter sports destinations"
        ]
      },
      eastern: {
        name: "Eastern Region",
        description: "A technologically advanced region with bustling cities and innovation hubs. Known for its modern infrastructure and economic growth.",
        population: "3.8M",
        area: "12,890 km²",
        capital: "Eastport",
        gdp: "$78B",
        highlights: [
          "Technology and innovation centers",
          "International trade hub",
          "Modern architecture",
          "Educational institutions"
        ]
      },
      central: {
        name: "Central Region",
        description: "The administrative heart with government buildings and cultural institutions. A blend of historical significance and modern development.",
        population: "4.2M",
        area: "18,765 km²",
        capital: "Capital City",
        gdp: "$92B",
        highlights: [
          "Government headquarters",
          "Museums and galleries",
          "Historic landmarks",
          "Business district"
        ]
      },
      western: {
        name: "Western Region",
        description: "An agricultural powerhouse with vast farmlands and vineyards. Renowned for organic farming and sustainable practices.",
        population: "1.9M",
        area: "21,340 km²",
        capital: "Westbrook",
        gdp: "$38B",
        highlights: [
          "Organic farming cooperatives",
          "Wine country and vineyards",
          "Agricultural festivals",
          "Rural tourism destinations"
        ]
      },
      southern: {
        name: "Southern Region",
        description: "A warm region with rich biodiversity and natural reserves. Popular for ecotourism and wildlife conservation efforts.",
        population: "2.1M",
        area: "19,567 km²",
        capital: "Southhaven",
        gdp: "$41B",
        highlights: [
          "National parks and reserves",
          "Diverse wildlife habitats",
          "Ecotourism programs",
          "Tropical beaches"
        ]
      },
      coastal: {
        name: "Coastal Region",
        description: "A maritime region with busy ports and beautiful beaches. Major center for fishing, shipping, and beach tourism.",
        population: "3.3M",
        area: "14,223 km²",
        capital: "Harbortown",
        gdp: "$65B",
        highlights: [
          "International seaports",
          "Fishing industry",
          "Beach resorts",
          "Maritime museums"
        ]
      }
    };

    let selectedRegion = null;

    function renderSidebar(regionId) {
      const data = regionData[regionId];
      const content = document.getElementById('sidebarContent');
      
      content.innerHTML = `
        <h2 class="sidebar-title">${data.name}</h2>
        <p class="sidebar-description">${data.description}</p>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Population</div>
            <div class="stat-value">${data.population}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Area</div>
            <div class="stat-value">${data.area}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Capital</div>
            <div class="stat-value">${data.capital}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">GDP</div>
            <div class="stat-value">${data.gdp}</div>
          </div>
        </div>
        
        <div class="info-section">
          <h3 class="info-title">Key Highlights</h3>
          <ul class="info-list">
            ${data.highlights.map(item => `<li>• ${item}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    function selectRegion(regionId) {
      const regions = document.querySelectorAll('.region');
      regions.forEach(r => r.classList.remove('selected'));
      
      const region = document.querySelector(`[data-region="${regionId}"]`);
      if (region) {
        region.classList.add('selected');
        selectedRegion = regionId;
        
        const sidebar = document.getElementById('sidebar');
        const mapSection = document.getElementById('mapSection');
        sidebar.classList.add('open');
        mapSection.classList.add('sidebar-open');
        
        renderSidebar(regionId);
      }
    }

    document.querySelectorAll('.region').forEach(region => {
      region.addEventListener('click', function() {
        const regionId = this.getAttribute('data-region');
        selectRegion(regionId);
      });
    });

    document.getElementById('closeBtn').addEventListener('click', function() {
      const sidebar = document.getElementById('sidebar');
      const mapSection = document.getElementById('mapSection');
      sidebar.classList.remove('open');
      mapSection.classList.remove('sidebar-open');
      
      const regions = document.querySelectorAll('.region');
      regions.forEach(r => r.classList.remove('selected'));
      selectedRegion = null;
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      
      if (searchTerm.length === 0) {
        return;
      }
      
      for (const [regionId, data] of Object.entries(regionData)) {
        if (data.name.toLowerCase().includes(searchTerm) || 
            data.capital.toLowerCase().includes(searchTerm) ||
            regionId.includes(searchTerm)) {
          selectRegion(regionId);
          break;
        }
      }
    });

    async function onConfigChange(config) {
      const titleElement = document.getElementById('mapTitle');
      const searchInput = document.getElementById('searchInput');
      
      titleElement.textContent = config.map_title || defaultConfig.map_title;
      searchInput.placeholder = config.search_placeholder || defaultConfig.search_placeholder;
      
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;
      
      document.body.style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
      
      const regions = document.querySelectorAll('.region');
      regions.forEach(region => {
        region.style.fill = accentColor;
        region.style.stroke = primaryColor;
      });
      
      const selectedRegions = document.querySelectorAll('.region.selected');
      selectedRegions.forEach(region => {
        region.style.fill = primaryColor;
      });
      
      const statCards = document.querySelectorAll('.stat-card');
      statCards.forEach(card => {
        card.style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
      });
      
      document.querySelector('.sidebar-title').style.color = primaryColor;
      document.querySelector('.close-btn').style.color = primaryColor;
      
      const infoTitle = document.querySelector('.info-title');
      if (infoTitle) {
        infoTitle.style.color = primaryColor;
      }
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => {
                config.primary_color = value;
                window.elementSdk.setConfig({ primary_color: value });
              }
            },
            {
              get: () => config.secondary_color || defaultConfig.secondary_color,
              set: (value) => {
                config.secondary_color = value;
                window.elementSdk.setConfig({ secondary_color: value });
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                window.elementSdk.setConfig({ surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => {
                config.accent_color = value;
                window.elementSdk.setConfig({ accent_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["map_title", config.map_title || defaultConfig.map_title],
          ["search_placeholder", config.search_placeholder || defaultConfig.search_placeholder]
        ])
      });
    }
  </script>

</html>
