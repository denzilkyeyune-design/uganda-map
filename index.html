<!DOCTYPE html>
<html>
<head>
    <title>Bantustats - Regions</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body>

<!-- LEFT SIDEBAR (MAP CONTROLS) -->
<div id="leftSidebar">
    <img src="bantustats.png" id="logo">

    <h2>Map Controls</h2>

    <label><input type="checkbox" id="toggleBasemap" checked> Basemap (on/off)</label><br>
    <label><input type="checkbox" id="toggleRegions" checked> Show Regions</label>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- RIGHT SIDEBAR (REGION INFO) -->
<div id="rightSidebar">
    <h2>Region Info</h2>
    <div id="region-details">Click a region to view details.</div>
</div>

<script src="script.js"></script>

</body>
</html>
