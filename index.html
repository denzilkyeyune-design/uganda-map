<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Uganda Regions Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

<div id="sidebar">
    <h2>Map Controls</h2>

    <label>
        <input type="checkbox" id="basemapToggle" checked>
        Basemap (on/off)
    </label>
    <br><br>

    <label>
        <input type="checkbox" id="regionsToggle">
        Show Regions
    </label>
    <br><br>

    <input id="searchBox" type="text" placeholder="Search region name…"/>
    <button id="searchBtn">Find</button>

    <div id="infoBox">
        <h3>No selection</h3>
        <p>Click a region to view details.</p>
    </div>
</div>

<div id="map"></div>

<script src="script.js"></script>
</body>
</html>
